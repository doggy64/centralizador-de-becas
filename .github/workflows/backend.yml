name: Backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ephemeral-ci-dev
      POSTGRES_TEST_PASSWORD: ephemeral-ci-test
      DATABASE_URL: postgresql://becas_test:ephemeral-ci-test@127.0.0.1:5434/becas_test
      TEST_DATABASE_URL: postgresql://becas_test:ephemeral-ci-test@127.0.0.1:5434/becas_test
      API_DATABASE_URL: postgresql://becas_test:ephemeral-ci-test@db-test:5432/becas_test
      WORKER_DATABASE_URL: postgresql://becas_test:ephemeral-ci-test@db-test:5432/becas_test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.head_ref }}
        run: python infra/check_ownership.py "$BASE" "$BRANCH"
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install -r apps/worker/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @becas/api --filter @becas/worker lint
      - run: pnpm --filter @becas/api --filter @becas/worker typecheck
      - run: pnpm format:check
      - run: pnpm --filter @becas/api --filter @becas/worker test
      - run: pnpm contracts:validate
      - run: docker compose -f infra/compose.yaml up -d --wait
      - run: pnpm demo:prepare
      - run: pnpm --filter @becas/api test:integration
      - run: docker compose -f infra/compose.yaml -f infra/services.yaml up -d --build --wait api
      - run: curl --fail http://localhost:3001/api/v1/scholarships/programa-de-prueba-edicion-2027-1
      - run: docker compose -f infra/compose.yaml -f infra/services.yaml run --build --rm worker --health
      - name: Verificar recorrido web si DEV 1 entrega la suite
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
        run: |
          if node -e "const fs=require('node:fs');process.exit(fs.existsSync('apps/web/package.json') && require('./apps/web/package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            pnpm --filter @becas/web test:e2e
          else
            echo "Suite E2E de DEV 1 pendiente de integración"
          fi
